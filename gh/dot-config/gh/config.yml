version: 1
git_protocol: ssh
editor:
prompt: enabled
prefer_editor_prompt: disabled
pager:
aliases:
    following: api /user/following --paginate
    followers: api /user/followers --paginate
    favs: api /user/starred --paginate
    enterprise: api graphql -f query="{enterprise(slug:\"$1\"){name slug id createdAt updatedAt description readme websiteUrl url}}" --jq ".data.enterprise"
# co: pr checkout # You may use `ghq get` instead of `gh pr checkout`
http_unix_socket:
browser:
